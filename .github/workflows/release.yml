name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify
        run: |
          go vet -tags mygo_nowebview ./...
          go tool mygo vet
          go test -tags mygo_nowebview -count=1 ./...

      - name: Build 526Hz.exe
        shell: pwsh
        run: |
          $env:GOFLAGS = "-tags=mygo_nowebview -buildvcs=false"
          go tool mygo build -skip-installer
          $exe = "release/windows-amd64/526Hz.exe"
          if (-not (Test-Path $exe)) { throw "526Hz.exe not found" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  526Hz.exe" | Out-File -Encoding ascii release/windows-amd64/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/windows-amd64/526Hz.exe
            release/windows-amd64/checksums.txt
