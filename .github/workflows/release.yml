name: Release

# Two kinds of release come out of this workflow:
#   - pushing a v* tag publishes a normal, versioned release;
#   - every push to main or a claude/** working branch (or a manual run) replaces the rolling
#     "preview" pre-release, so the latest build can always be downloaded and tried.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify
        run: |
          go vet -tags mygo_nowebview ./...
          go tool mygo vet
          go test -tags mygo_nowebview -count=1 ./...

      - name: Build Xi.exe
        shell: pwsh
        run: |
          $env:GOFLAGS = "-tags=mygo_nowebview -buildvcs=false"
          go tool mygo build -skip-installer
          # Take whatever executable the build produced and publish it under one fixed name.
          $built = Get-ChildItem release -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $built) { throw "no executable was produced under release/" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $built.FullName dist/Xi.exe
          $hash = (Get-FileHash dist/Xi.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Xi.exe" | Out-File -Encoding ascii dist/checksums.txt

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Xi.exe
            dist/checksums.txt

      - name: Publish rolling preview
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $short = "${{ github.sha }}".Substring(0, 7)
          $notes = "自动构建的预览版，随每次推送更新，可能不稳定。`n`n分支：${{ github.ref_name }}`n提交：$short"
          # Replace the previous preview so the tag always points at this build.
          gh release delete preview --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create preview dist/Xi.exe dist/checksums.txt `
            --prerelease `
            --target "${{ github.sha }}" `
            --title "汐 预览版 ($short)" `
            --notes $notes
